# LG 트윈스 색상 유래 팔레트(색상만). 출처·대비비: data/brand_palette.yaml, docs/설계서v1.md §9.
[server]
# 바인딩 주소·포트는 이 파일에 두지 않는다.
# Streamlit Community Cloud 가 덮어쓴다고 문서화한 옵션은 runOnSave·enableXsrfProtection·
# showErrorDetails·fastReruns·gatherUsageStats 다섯 개뿐이고 server.address 는 거기 없다.
# server.address 는 실제 소켓 바인딩이므로 파일에 127.0.0.1 을 커밋하면 Cloud 헬스체크가
# 닿지 못해 앱이 뜨지 않을 수 있다. 로컬 루프백 바인딩은 Makefile 의 실행 플래그로 강제한다
# (설정 우선순위: 명령행 > 환경변수 > 이 파일). 자세한 근거는 docs/배포.md 3-A.
headless = true
enableStaticServing = false

[browser]
gatherUsageStats = false

[theme]
# 색상 키·base 금지: 색상이 여기 있으면 light 단일 테마로 고정된다.
font              = "Pretendard, system-ui, sans-serif"
headingFont       = "Pretendard, system-ui, sans-serif"
codeFont          = "ui-monospace, SFMono-Regular, Menlo, monospace"
baseFontSize      = 16
baseFontWeight    = 400
headingFontWeights = [700, 600, 600]
baseRadius        = "medium"
buttonRadius      = "full"
showWidgetBorder  = true
showSidebarBorder = true
metricValueFontSize   = "2rem"
metricValueFontWeight = 700

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2"
weight = 700
style = "normal"

